---
apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: node-affinity-values
replacements:
  # The overlay patches scheduling-settings data.environment. CPU and GPU
  # strings are sourceValue literals; the workload label selects which one
  # applies. Each kind is its own select. Kustomize 5.7.0 matches kind
  # exactly, so a combined Deployment|StatefulSet|Job select matches nothing
  # and leaves the placeholders. Kustomize 5.8.1 matches these exact kinds.
  - source:
      kind: ConfigMap
      name: scheduling-settings
      fieldPath: data.environment
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/environment$].values.[=^ENV_PLACEHOLDER$]
      - select:
          kind: StatefulSet
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/environment$].values.[=^ENV_PLACEHOLDER$]
      - select:
          kind: Job
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/environment$].values.[=^ENV_PLACEHOLDER$]
      - select:
          kind: CronJob
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/environment$].values.[=^ENV_PLACEHOLDER$]
  - sourceValue: cpu
    targets:
      - select:
          kind: Deployment
          labelSelector: scheduling.my.cluster/compute=cpu
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
      - select:
          kind: StatefulSet
          labelSelector: scheduling.my.cluster/compute=cpu
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
      - select:
          kind: Job
          labelSelector: scheduling.my.cluster/compute=cpu
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
      - select:
          kind: CronJob
          labelSelector: scheduling.my.cluster/compute=cpu
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
  - sourceValue: gpu
    targets:
      - select:
          kind: Deployment
          labelSelector: scheduling.my.cluster/compute=gpu
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
      - select:
          kind: StatefulSet
          labelSelector: scheduling.my.cluster/compute=gpu
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
      - select:
          kind: Job
          labelSelector: scheduling.my.cluster/compute=gpu
        fieldPaths:
          - spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
      - select:
          kind: CronJob
          labelSelector: scheduling.my.cluster/compute=gpu
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.*.matchExpressions.[key=^my\.cluster/compute$].values.[=^COMPUTE_PLACEHOLDER$]
